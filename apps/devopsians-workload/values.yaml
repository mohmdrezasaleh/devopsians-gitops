fastapi:
  replicaCount: 3
  image:
    repository: week2-fastapi
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  env:
    redisPort: "6379"
    redisDb: "0"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  probes:
    path: /status
    startup:
      failureThreshold: 30
      periodSeconds: 2
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5

redis:
  image:
    repository: redis
    tag: "7-alpine"
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  persistence:
    enabled: true
    storageClass: longhorn-replicated
    size: 1Gi
    accessMode: ReadWriteOnce

ingress:
  enabled: true
  className: traefik
  host: api.devopsians.local
  clusterIssuer: selfsigned-cluster-issuer
  tlsSecret: api-devopsians-tls
