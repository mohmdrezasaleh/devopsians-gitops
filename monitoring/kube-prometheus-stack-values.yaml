prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests: {cpu: 100m, memory: 400Mi}
      limits: {memory: 900Mi}
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-replicated
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    hosts: [prometheus.devopsians.local]
    tls:
      - secretName: prometheus-tls
        hosts: [prometheus.devopsians.local]

grafana:
  adminPassword: "CHANGE_ME"
  resources:
    requests: {cpu: 50m, memory: 200Mi}
    limits: {memory: 512Mi}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    hosts: [grafana.devopsians.local]
    tls:
      - secretName: grafana-tls
        hosts: [grafana.devopsians.local]

alertmanager:
  config:
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot-token/token
            chat_id: -1001234567890
            parse_mode: HTML
            send_resolved: true
            message: |
              {{ range .Alerts }}
              <b>{{ .Status | toUpper }}</b> {{ .Labels.alertname }}
              severity: {{ .Labels.severity }}
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
  alertmanagerSpec:
    secrets:
      - telegram-bot-token
    resources:
      requests: {cpu: 10m, memory: 50Mi}
      limits: {memory: 120Mi}

kube-state-metrics:
  image:
    registry: docker.io
    repository: bitnamilegacy/kube-state-metrics
    tag: latest

prometheusOperator: {}
